<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Kaushan';
            src: url('KaushanScript-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Kaushan', Times, serif;
            font-size: 3em;
        }
    </style>
  </head>
  <body>
    <main>
      <h1>Título</h1>
      <p>
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Nemo error
        dignissimos, tenetur, id placeat dolores eum velit ipsum recusandae
        reprehenderit, quod sit et eius deleniti assumenda perferendis esse.
        Beatae, placeat!
      </p>
    </main>
  </body>
</html>
